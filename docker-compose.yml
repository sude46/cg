services:
  mysql-master:
    image: mariadb:10.6
    container_name: weibo-mysql-master
    env_file: .env
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=weibo
      - MYSQL_USER=weibo
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - /data/mysql-master:/var/lib/mysql
      - ./docker/mysql/master.cnf:/etc/mysql/conf.d/master.cnf
      - ./docker/mysql/init_master.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - weibo-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-replica-1:
    image: mariadb:10.6
    container_name: weibo-mysql-replica-1
    env_file: .env
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - /data/mysql-replica-1:/var/lib/mysql
      - ./docker/mysql/replica.cnf:/etc/mysql/conf.d/replica.cnf
      - ./docker/mysql/init_replica.sh:/docker-entrypoint-initdb.d/init_replica.sh
    networks:
      - weibo-network
    depends_on:
      mysql-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-master:
    image: redis:7-alpine
    container_name: weibo-redis-master
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - /data/redis-master:/data
      - ./docker/redis/master.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf","--requirepass","${REDIS_PASSWORD}"]
    networks:
      - weibo-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a","${REDIS_PASSWORD}","--no-auth-warning","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis-replica-1:
    image: redis:7-alpine
    container_name: weibo-redis-replica-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - /data/redis-replica-1:/data
      - ./docker/redis/replica.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf","--requirepass","${REDIS_PASSWORD}","--masterauth", "${REDIS_PASSWORD}"]
    networks:
      - weibo-network
    depends_on:
      redis-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli","-a","${REDIS_PASSWORD}","--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica-2:
    image: redis:7-alpine
    container_name: weibo-redis-replica-2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - /data/redis-replica-2:/data
      - ./docker/redis/replica.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}", "--masterauth", "${REDIS_PASSWORD}"] 
    networks:
      - weibo-network
    depends_on:
      redis-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: weibo-redis-sentinel-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:26379:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/tmp/sentinel.conf:ro
      - ./docker/redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - weibo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment: 
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: weibo-redis-sentinel-2
    restart: unless-stopped
    ports:
      - "127.0.0.1:26380:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/tmp/sentinel.conf:ro
      - ./docker/redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - weibo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment: 
      - REDIS_PASSWORD=${REDIS_PASSWORD}


  redis-sentinel-3:
    image: redis:7-alpine
    container_name: weibo-redis-sentinel-3
    restart: unless-stopped
    ports:
      - "127.0.0.1:26381:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/tmp/sentinel.conf:ro
      - ./docker/redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - weibo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  redis-celery:
    image: redis:7-alpine
    container_name: weibo-redis-celery
    restart: unless-stopped
    ports:
      - "127.0.0.1:6382:6379"
    networks:
      - weibo-network
    command: ["redis-server","--requirepass","${REDIS_PASSWORD}","--maxmemory","150mb","--maxmemory-policy","allkeys-lru"] 
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli","-a","${REDIS_PASSWORD}","--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    image: weibo-platform-app:latest
    container_name: weibo-app
    entrypoint: ["/bin/sh", "/app/scripts/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file: .env
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_CONFIG=production
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=weibo-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_TRACES_SAMPLER_ARG=1.0
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica-1:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      elasticsearch-cn:
        condition: service_healthy
    networks:
      - weibo-network
    volumes:
      - uploads_data:/app/app/static/uploads


  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: weibo-platform-web:latest
    container_name: weibo-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - weibo-network

  celery-worker:
    image: weibo-platform-app:latest
    container_name: weibo-celery-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - FLASK_APP=wsgi.py
      - EVENT_BUS_ENABLED=0
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=weibo-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_TRACES_SAMPLER_ARG=1.0
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      redis-celery:
        condition: service_started
      elasticsearch-cn:
        condition: service_healthy
    networks:
      - weibo-network
    command: celery -A core.celery_app.celery_app worker -l info -Q default,like,feed -c 4
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.celery_app.celery_app inspect ping --timeout 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery-beat:
    image: weibo-platform-app:latest
    container_name: weibo-celery-beat
    restart: unless-stopped
    env_file: .env
    environment:
      - FLASK_APP=wsgi.py
    depends_on:
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      redis-celery:
        condition: service_started
    networks:
      - weibo-network
    command: celery -A core.celery_app.celery_app beat -l info -s /tmp/celerybeat-schedule

  elasticsearch-cn:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: weibo-es-cn
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - es_data_cn:/usr/share/elasticsearch/data
      - ./elasticsearch/plugins:/usr/share/elasticsearch/plugins
    networks:
      - weibo-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  es_data_cn:
  uploads_data:

networks:
  weibo-network:
    driver: bridge
