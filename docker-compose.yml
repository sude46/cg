services:
  mysql-master:
    image: mariadb:10.6
    container_name: weibo-mysql-master
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=weibo
      - MYSQL_USER=weibo
      - MYSQL_PASSWORD=123456
    ports:
      - "3306:3306"
    volumes:
      - /data/mysql-master:/var/lib/mysql
      - ./docker/mysql/master.cnf:/etc/mysql/conf.d/master.cnf
      - ./docker/mysql/init_master.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - weibo-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-replica-1:
    image: mariadb:10.6
    container_name: weibo-mysql-replica-1
    environment:
      - MYSQL_ROOT_PASSWORD=123456
    ports:
      - "3307:3306"
    volumes:
      - /data/mysql-replica-1:/var/lib/mysql
      - ./docker/mysql/replica.cnf:/etc/mysql/conf.d/replica.cnf
      - ./docker/mysql/init_replica.sh:/docker-entrypoint-initdb.d/init_replica.sh
    networks:
      - weibo-network
    depends_on:
      mysql-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-master:
    image: redis:7-alpine
    container_name: weibo-redis-master
    ports:
      - "6379:6379"
    volumes:
      - /data/redis-master:/data
      - ./docker/redis/master.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - weibo-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis-replica-1:
    image: redis:7-alpine
    container_name: weibo-redis-replica-1
    ports:
      - "6380:6379"
    volumes:
      - /data/redis-replica-1:/data
      - ./docker/redis/replica.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - weibo-network
    depends_on:
      redis-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica-2:
    image: redis:7-alpine
    container_name: weibo-redis-replica-2
    ports:
      - "6381:6379"
    volumes:
      - /data/redis-replica-2:/data
      - ./docker/redis/replica.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - weibo-network
    depends_on:
      redis-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: weibo-redis-sentinel-1
    ports:
      - "26379:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/tmp/sentinel.conf:ro
      - ./docker/redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - weibo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: weibo-redis-sentinel-2
    ports:
      - "26380:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/tmp/sentinel.conf:ro
      - ./docker/redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - weibo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: weibo-redis-sentinel-3
    ports:
      - "26381:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/tmp/sentinel.conf:ro
      - ./docker/redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - weibo-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-celery:
    image: redis:7-alpine
    container_name: weibo-redis-celery
    ports:
      - "6382:6379"
    networks:
      - weibo-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    image: weibo-platform-app:latest
    container_name: weibo-app
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=development
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica-1:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      elasticsearch-cn:
        condition: service_healthy
    networks:
      - weibo-network
    volumes:
      - .:/app
    command: flask run --host=0.0.0.0 --reload

  celery-worker:
    image: weibo-platform-app:latest
    container_name: weibo-celery-worker
    env_file: .env
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=development
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      redis-celery:
        condition: service_started
      elasticsearch-cn:
        condition: service_healthy
    networks:
      - weibo-network
    volumes:
      - .:/app
    command: celery -A core.celery_app.celery_app worker -l info -Q default,like -c 4
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.celery_app.celery_app inspect ping --timeout 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery-beat:
    image: weibo-platform-app:latest
    container_name: weibo-celery-beat
    env_file: .env
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=development
    depends_on:
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
      redis-celery:
        condition: service_started
    networks:
      - weibo-network
    volumes:
      - .:/app
    command: celery -A core.celery_app.celery_app beat -l info -s /tmp/celerybeat-schedule

  elasticsearch-cn:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: weibo-es-cn
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9201:9200"
    volumes:
      - es_data_cn:/usr/share/elasticsearch/data
      - ./elasticsearch/plugins:/usr/share/elasticsearch/plugins
    networks:
      - weibo-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  es_data_cn:

networks:
  weibo-network:
    driver: bridge
