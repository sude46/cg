name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & deps sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: requirements.txt 与 pyproject.toml 同步校验
        run: python scripts/check_requirements_sync.py

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # 单测使用 testing 配置(SQLite 内存) + FakeRedis，不依赖外部服务。
    # 关闭 ES、把 Redis/Celery 指向本地/内存，保证裸 runner 上可跑。
    env:
      ELASTICSEARCH_ENABLED: "false"
      REDIS_SENTINEL_HOST: ""
      REDIS_HOST: "127.0.0.1"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      CELERY_BROKER_URL: "memory://"
      CELERY_RESULT_BACKEND: "cache"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/unit -q
