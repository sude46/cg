services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: weibo-prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
      - weibo-network  # 关键：加入业务网络，才能解析 app:5000

  grafana:
    image: grafana/grafana:10.1.0
    container_name: weibo-grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: weibo-alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: weibo-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    network_mode: host
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.54.0
    container_name: weibo-redis-exporter
    environment:
      - REDIS_ADDR=redis://weibo-redis-master:6379
    ports:
      - "9121:9121"
    networks:
      - monitoring
      - weibo-network

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.0
    container_name: weibo-mysqld-exporter
    environment:
      - DATA_SOURCE_NAME=root:123456@(weibo-mysql-master:3306)/
    command:
      - '--collect.slave_status'
      - '--collect.global_status'
      - '--collect.global_variables'
      - '--collect.info_schema.tables'
      - '--no-collect.info_schema.innodb_metrics'
    ports:
      - "9104:9104"
    networks:
      - monitoring
      - weibo-network
    restart: unless-stopped

  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: weibo-celery-exporter
    environment:
      - CE_BROKER_URL=redis://weibo-redis-celery:6379/0
      - CE_LISTEN_ADDRESS=:9540
    ports:
      - "9540:9540"
    networks:
      - monitoring
      - weibo-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: weibo-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.0
    container_name: weibo-promtail
    volumes:
      - ../logs:/var/log/weibo:ro
      - ./promtail:/etc/promtail
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  weibo-network:
    external: true
    name: weibo-platform_weibo-network  # 与 docker-compose.yml 实际创建的网络名一致

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
